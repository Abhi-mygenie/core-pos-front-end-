<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>RP1 – Reports List Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<!-- Status Bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:28px 40px 20px;font-size:32px;font-weight:600;color:#111827">
  <span>8:52</span>
  <div style="display:flex;align-items:center;gap:12px">
    <span>5G</span>
    <svg width="56" height="28" viewBox="0 0 56 28"><rect x="1" y="1" width="50" height="26" rx="5" fill="#111827"/><rect x="51" y="9" width="4" height="10" rx="2" fill="#111827"/></svg>
  </div>
</div>

<!-- Nav Bar -->
<div id="nav" style="display:flex;align-items:center;gap:24px;padding:16px 40px 20px;background:white;border-bottom:1px solid #E5E7EB">
  <div style="width:72px;height:72px;background:#F3F4F6;border-radius:18px;display:flex;align-items:center;justify-content:center">
    <span style="font-size:40px;color:#374151;font-weight:300">‹</span>
  </div>
  <div>
    <div style="font-size:52px;font-weight:700;color:#111827;line-height:1.1">Reports</div>
    <div style="font-size:28px;color:#9CA3AF;margin-top:4px">Demo Kitchen — Koramangala</div>
  </div>
</div>

<!-- Reports List -->
<div style="padding:24px 0">
  <!-- Items 1-3: highlighted group -->
  <div id="highlight-group" style="background:white;margin-bottom:0">
    <!-- Dashboard Report -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#EFF6FF;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">📊</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Dashboard Report</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <!-- Profit & Loss -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#F0FDF4;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">📈</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Profit &amp; Loss</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <!-- Orders -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#FFF7ED;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">🧾</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Orders</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
  </div>

  <!-- Items 4-9: non-highlighted -->
  <div id="remaining-items">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#FDF4FF;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">🏷</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Item Sales</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#FFF1F2;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">❌</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Cancellations</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#F0FDF4;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">💳</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Payments</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#EFF6FF;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">👥</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Staff</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;border-bottom:1px solid #F3F4F6;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#FFF7ED;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">👤</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Customers</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:36px 48px;background:white">
      <div style="display:flex;align-items:center;gap:24px">
        <div style="width:60px;height:60px;background:#F0FDF4;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px">⚖</div>
        <span style="font-size:38px;font-weight:600;color:#111827">Payout Match</span>
      </div>
      <span style="font-size:36px;color:#D1D5DB;font-weight:300">›</span>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.querySelector('body > div:first-child').style.filter='brightness(0.6)';
  document.getElementById('nav').style.filter='brightness(0.6)';
  document.getElementById('remaining-items').style.filter='brightness(0.6)';
  const grp = document.getElementById('highlight-group');
  grp.style.outline='3px solid #F87171';
  grp.style.outlineOffset='6px';
  grp.style.borderRadius='16px';
  grp.style.position='relative';
  grp.style.zIndex='10';
}
</script>
</body>
</html>
