<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>TK1 – Takeaway Ready Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<!-- Status Bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:28px 40px 20px;font-size:32px;font-weight:600;color:#111827">
  <span>8:52</span>
  <div style="display:flex;align-items:center;gap:12px">
    <span>5G</span>
    <svg width="56" height="28" viewBox="0 0 56 28"><rect x="1" y="1" width="50" height="26" rx="5" fill="#111827"/><rect x="51" y="9" width="4" height="10" rx="2" fill="#111827"/></svg>
  </div>
</div>

<!-- Nav Bar -->
<div id="nav" style="display:flex;align-items:center;gap:24px;padding:16px 40px 20px;background:white;border-bottom:1px solid #E5E7EB">
  <div style="width:72px;height:72px;background:#F3F4F6;border-radius:18px;display:flex;align-items:center;justify-content:center">
    <span style="font-size:40px;color:#374151;font-weight:300">‹</span>
  </div>
  <div>
    <div style="font-size:52px;font-weight:700;color:#111827;line-height:1.1">Order #1066</div>
    <div style="font-size:28px;color:#9CA3AF;margin-top:4px">Takeaway · Demo Kitchen — Koramangala</div>
  </div>
</div>

<div style="padding:36px 40px;display:flex;flex-direction:column;gap:28px">

  <!-- Ready Status Badge - Prominent -->
  <div id="ready-badge" style="text-align:center;padding:36px 0">
    <div style="display:inline-flex;align-items:center;gap:16px;background:#DCFCE7;border:2px solid #86EFAC;padding:24px 60px;border-radius:999px;box-shadow:0 4px 20px rgba(29,170,75,0.2)">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#1DAA4B" stroke-width="3"/><path d="M11 21l6 6 12-13" stroke="#1DAA4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:44px;font-weight:800;color:#166534">Ready for Pickup</span>
    </div>
  </div>

  <!-- Order Items Card -->
  <div id="items-card" style="background:white;border-radius:20px;padding:36px;box-shadow:0 1px 4px rgba(0,0,0,0.07)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <span style="font-size:28px;font-weight:700;color:#111827;letter-spacing:0.03em">ORDER</span>
      <span style="background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;padding:8px 24px;border-radius:999px;font-size:24px;font-weight:600">POS</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:34px;color:#111827;margin-bottom:16px">
      <span>1×  Paneer Butter Masala</span><span style="font-weight:600">₹380.00</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:34px;color:#111827;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid #F3F4F6">
      <span>2×  Butter Naan</span><span style="font-weight:600">₹120.00</span>
    </div>
    <div style="border-top:2px dashed #E5E7EB;padding-top:24px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:26px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.08em">GRAND TOTAL</span>
        <span style="font-size:52px;font-weight:900;font-family:'SF Mono',Consolas,monospace;color:#111827">₹500.00</span>
      </div>
    </div>
  </div>

  <!-- Order Type Card -->
  <div id="order-type" style="background:white;border-radius:20px;padding:32px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07)">
    <div style="display:flex;justify-content:space-between;font-size:32px;color:#374151;margin-bottom:16px">
      <span>Order Type</span><span style="font-weight:700">Takeaway</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:32px;color:#374151;margin-bottom:16px">
      <span>Order Number</span><span style="font-weight:700">#1066</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:32px;color:#374151">
      <span>Counter</span><span style="font-weight:700">Counter 1</span>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.querySelector('body > div:first-child').style.filter='brightness(0.6)';
  document.getElementById('nav').style.filter='brightness(0.6)';
  document.getElementById('items-card').style.filter='brightness(0.6)';
  document.getElementById('order-type').style.filter='brightness(0.6)';
  const badge = document.getElementById('ready-badge');
  badge.style.outline='3px solid #F87171';
  badge.style.outlineOffset='8px';
  badge.style.borderRadius='999px';
  badge.style.position='relative';
  badge.style.zIndex='10';
}
</script>
</body>
</html>
