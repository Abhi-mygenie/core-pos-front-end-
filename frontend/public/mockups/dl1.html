<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>DL1 – Delivery Rider Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<!-- Status Bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:28px 40px 20px;font-size:32px;font-weight:600;color:#111827">
  <span>8:52</span>
  <div style="display:flex;align-items:center;gap:12px">
    <span>5G</span>
    <svg width="56" height="28" viewBox="0 0 56 28"><rect x="1" y="1" width="50" height="26" rx="5" fill="#111827"/><rect x="51" y="9" width="4" height="10" rx="2" fill="#111827"/></svg>
  </div>
</div>

<!-- Nav Bar -->
<div id="nav" style="display:flex;align-items:center;gap:24px;padding:16px 40px 20px;background:white;border-bottom:1px solid #E5E7EB">
  <div style="width:72px;height:72px;background:#F3F4F6;border-radius:18px;display:flex;align-items:center;justify-content:center">
    <span style="font-size:40px;color:#374151;font-weight:300">‹</span>
  </div>
  <div>
    <div style="font-size:52px;font-weight:700;color:#111827;line-height:1.1">Order #1066</div>
    <div style="font-size:28px;color:#9CA3AF;margin-top:4px">Delivery · Demo Kitchen — Koramangala</div>
  </div>
</div>

<div style="padding:32px 40px;display:flex;flex-direction:column;gap:24px">

  <!-- Status Badge -->
  <div id="status-zone" style="text-align:center;padding:28px 0">
    <div style="display:inline-flex;align-items:center;gap:14px;background:#DCFCE7;border:2px solid #86EFAC;padding:18px 48px;border-radius:999px">
      <div style="width:16px;height:16px;background:#1DAA4B;border-radius:50%"></div>
      <span style="font-size:36px;font-weight:700;color:#166534">Out for Delivery</span>
    </div>
  </div>

  <!-- Order Items Card -->
  <div id="items-card" style="background:white;border-radius:20px;padding:36px;box-shadow:0 1px 4px rgba(0,0,0,0.07)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <span style="font-size:28px;font-weight:700;color:#111827;letter-spacing:0.03em">ORDER</span>
      <span style="background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;padding:8px 24px;border-radius:999px;font-size:24px;font-weight:600">POS</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:34px;color:#111827;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #F3F4F6">
      <span>1×  Veg Hakka Noodles</span><span style="font-weight:600">₹260.00</span>
    </div>
    <div style="border-top:2px dashed #E5E7EB;padding-top:20px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:26px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.08em">GRAND TOTAL</span>
        <span style="font-size:48px;font-weight:900;font-family:'SF Mono',Consolas,monospace;color:#111827">₹260.00</span>
      </div>
    </div>
  </div>

  <!-- Rider Assigned Card -->
  <div id="rider-card" style="background:white;border-radius:20px;padding:36px;box-shadow:0 1px 4px rgba(0,0,0,0.07)">
    <div style="font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:24px">RIDER ASSIGNED</div>
    <div style="display:flex;align-items:center;gap:24px">
      <div style="width:88px;height:88px;background:#F3F4F6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px">🏍</div>
      <div style="flex:1">
        <div style="font-size:44px;font-weight:700;color:#111827;margin-bottom:6px">Ravi</div>
        <div style="font-size:28px;color:#9CA3AF">98XXXXXX21</div>
      </div>
      <div style="background:#DCFCE7;border:1px solid #BBF7D0;padding:12px 28px;border-radius:999px;color:#166534;font-size:26px;font-weight:600">Out for Delivery</div>
    </div>
  </div>

  <!-- Order Type -->
  <div id="order-type" style="background:white;border-radius:20px;padding:28px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07)">
    <div style="display:flex;justify-content:space-between;font-size:30px;color:#374151">
      <span>Order Type</span><span style="font-weight:600">Delivery</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:30px;color:#374151;margin-top:16px">
      <span>Order Number</span><span style="font-weight:600">#1066</span>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.querySelector('body > div:first-child').style.filter='brightness(0.6)';
  document.getElementById('nav').style.filter='brightness(0.6)';
  document.getElementById('items-card').style.filter='brightness(0.6)';
  document.getElementById('order-type').style.filter='brightness(0.6)';
  // Highlight rider card and status badge
  document.getElementById('rider-card').style.outline='3px solid #F87171';
  document.getElementById('rider-card').style.outlineOffset='6px';
  document.getElementById('rider-card').style.borderRadius='20px';
  document.getElementById('rider-card').style.position='relative';
  document.getElementById('rider-card').style.zIndex='10';
  document.getElementById('status-zone').style.outline='3px solid #F87171';
  document.getElementById('status-zone').style.outlineOffset='4px';
  document.getElementById('status-zone').style.borderRadius='999px';
  document.getElementById('status-zone').style.position='relative';
  document.getElementById('status-zone').style.zIndex='10';
}
</script>
</body>
</html>
