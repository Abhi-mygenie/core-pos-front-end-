<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LV1 – Live Operations Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<!-- Status Bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:28px 40px 20px;font-size:32px;font-weight:600;color:#111827">
  <span>8:52</span>
  <div style="display:flex;align-items:center;gap:12px">
    <span>5G</span>
    <svg width="56" height="28" viewBox="0 0 56 28"><rect x="1" y="1" width="50" height="26" rx="5" fill="#111827"/><rect x="51" y="9" width="4" height="10" rx="2" fill="#111827"/></svg>
  </div>
</div>

<!-- Nav Bar -->
<div id="nav" style="display:flex;align-items:center;gap:24px;padding:16px 40px 20px;background:white;border-bottom:1px solid #E5E7EB">
  <div style="width:72px;height:72px;background:#F3F4F6;border-radius:18px;display:flex;align-items:center;justify-content:center">
    <span style="font-size:40px;color:#374151;font-weight:300">‹</span>
  </div>
  <div>
    <div style="font-size:52px;font-weight:700;color:#111827;line-height:1.1">Live Operations</div>
    <div style="font-size:28px;color:#9CA3AF;margin-top:4px">Demo Kitchen — Koramangala · Now</div>
  </div>
</div>

<div style="padding:28px 40px;display:flex;flex-direction:column;gap:20px">
  <!-- Summary Banner -->
  <div id="summary-banner" style="background:white;border-radius:20px;padding:32px 40px;box-shadow:0 1px 4px rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:20px;height:20px;background:#1DAA4B;border-radius:50%;box-shadow:0 0 0 4px rgba(29,170,75,0.2)"></div>
      <span style="font-size:44px;font-weight:800;color:#111827">4 Running Tables</span>
    </div>
    <span style="font-size:28px;color:#9CA3AF">LIVE</span>
  </div>

  <!-- Live Order Cards -->
  <div id="live-cards">
    <!-- Table 2 -->
    <div style="background:white;border-radius:20px;padding:28px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:38px;font-weight:700;color:#111827;margin-bottom:6px">Table 2</div>
        <div style="font-size:28px;color:#9CA3AF">2 items</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:40px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827;margin-bottom:6px">₹680.00</div>
        <div style="display:inline-block;background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;padding:6px 20px;border-radius:999px;font-size:24px;font-weight:600">Running</div>
      </div>
    </div>
    <!-- Table 5 -->
    <div style="background:white;border-radius:20px;padding:28px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:38px;font-weight:700;color:#111827;margin-bottom:6px">Table 5</div>
        <div style="font-size:28px;color:#9CA3AF">3 items</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:40px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827;margin-bottom:6px">₹720.00</div>
        <div style="display:inline-block;background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;padding:6px 20px;border-radius:999px;font-size:24px;font-weight:600">Running</div>
      </div>
    </div>
    <!-- Table 7 -->
    <div style="background:white;border-radius:20px;padding:28px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:38px;font-weight:700;color:#111827;margin-bottom:6px">Table 7</div>
        <div style="font-size:28px;color:#9CA3AF">1 item</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:40px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827;margin-bottom:6px">₹260.00</div>
        <div style="display:inline-block;background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;padding:6px 20px;border-radius:999px;font-size:24px;font-weight:600">Running</div>
      </div>
    </div>
    <!-- Swiggy Online -->
    <div style="background:white;border-radius:20px;padding:28px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:38px;font-weight:700;color:#111827;margin-bottom:6px">Swiggy #1068</div>
        <div style="font-size:28px;color:#9CA3AF">Online Order</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:40px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827;margin-bottom:6px">₹540.00</div>
        <div style="display:inline-block;background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;padding:6px 20px;border-radius:999px;font-size:24px;font-weight:600">Preparing</div>
      </div>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.querySelector('body > div:first-child').style.filter='brightness(0.6)';
  document.getElementById('nav').style.filter='brightness(0.6)';
  document.getElementById('live-cards').style.filter='brightness(0.6)';
  const banner = document.getElementById('summary-banner');
  banner.style.outline='3px solid #F87171';
  banner.style.outlineOffset='6px';
  banner.style.borderRadius='20px';
  banner.style.position='relative';
  banner.style.zIndex='10';
}
</script>
</body>
</html>
