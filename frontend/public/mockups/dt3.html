<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DT3 – P&L Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;display:flex}
</style>
</head>
<body>
<!-- Sidebar -->
<div id="sidebar" style="width:220px;min-width:220px;background:#1A1A2E;display:flex;flex-direction:column;padding:28px 0">
  <div style="padding:0 24px 32px;border-bottom:1px solid rgba(255,255,255,0.1)">
    <div style="font-size:28px;font-weight:800;color:white">myg<span style="color:#1DAA4B">enie</span></div>
    <div style="font-size:14px;color:#6B7280;margin-top:4px">POS</div>
  </div>
  <div style="padding:20px 16px;flex:1">
    <div style="padding:14px 16px;color:#9CA3AF;font-size:16px;margin-bottom:4px">▦ Dashboard</div>
    <div style="padding:14px 16px;color:#9CA3AF;font-size:16px;margin-bottom:4px">☰ Orders</div>
    <div style="padding:14px 16px;border-radius:10px;background:rgba(255,255,255,0.1);color:white;font-size:16px;font-weight:600;margin-bottom:4px">✦ Reports</div>
    <div style="padding:14px 16px;color:#9CA3AF;font-size:16px">⚙ Settings</div>
  </div>
</div>

<!-- Main -->
<div style="flex:1;padding:32px 40px;overflow:hidden">
  <!-- Header -->
  <div style="margin-bottom:28px" id="header">
    <div style="font-size:26px;font-weight:700;color:#111827">Profit &amp; Loss Report</div>
    <div style="font-size:15px;color:#9CA3AF;margin-top:4px">Demo Kitchen — Koramangala · Today</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <!-- Hero P&L Card -->
    <div id="pl-hero" style="background:#0A0A0A;border-radius:20px;padding:40px;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:16px">NET P&amp;L</div>
      <div style="font-size:76px;font-weight:900;color:#4ADE80;font-family:'SF Mono',Consolas,monospace;letter-spacing:-0.03em;line-height:1">₹9,850.00</div>
      <div style="font-size:15px;color:#6B7280;margin-top:16px">Today · Demo Kitchen — Koramangala</div>
    </div>

    <!-- P&L Breakdown Card -->
    <div id="pl-breakdown" style="background:white;border-radius:20px;padding:36px;box-shadow:0 1px 4px rgba(0,0,0,0.06)">
      <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:24px">BREAKDOWN</div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F3F4F6;font-size:17px">
        <span style="color:#374151">Sales</span><span style="font-weight:600;font-family:'SF Mono',Consolas,monospace;color:#111827">₹48,650.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F3F4F6;font-size:17px">
        <span style="color:#374151">Paid Revenue</span><span style="font-weight:600;font-family:'SF Mono',Consolas,monospace;color:#111827">₹46,900.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F3F4F6;font-size:17px">
        <span style="color:#374151">Purchase</span><span style="font-weight:600;font-family:'SF Mono',Consolas,monospace;color:#2563EB">−₹16,500.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F3F4F6;font-size:17px">
        <span style="color:#374151">Expenses</span><span style="font-weight:600;font-family:'SF Mono',Consolas,monospace;color:#F58346">−₹22,300.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:16px 0 0;font-size:20px">
        <span style="font-weight:700;color:#111827">Net P&amp;L</span><span style="font-weight:800;font-family:'SF Mono',Consolas,monospace;color:#1DAA4B">₹9,850.00</span>
      </div>
      <!-- P&L Bar -->
      <div style="margin-top:24px;height:12px;border-radius:999px;overflow:hidden;display:flex">
        <div style="flex:49;background:#1DAA4B"></div>
        <div style="flex:17;background:#2563EB"></div>
        <div style="flex:23;background:#F58346"></div>
      </div>
      <div style="display:flex;gap:20px;margin-top:10px;font-size:12px;color:#9CA3AF">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:#1DAA4B"></div>Revenue</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:#2563EB"></div>Purchase</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:#F58346"></div>Expenses</div>
      </div>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.getElementById('sidebar').style.filter='brightness(0.6)';
  document.getElementById('header').style.filter='brightness(0.6)';
  document.getElementById('pl-breakdown').style.filter='brightness(0.6)';
  const hero = document.getElementById('pl-hero');
  hero.style.outline='3px solid #F87171';
  hero.style.outlineOffset='6px';
  hero.style.borderRadius='20px';
  hero.style.position='relative';
  hero.style.zIndex='10';
}
</script>
</body>
</html>
