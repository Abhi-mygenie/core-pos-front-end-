<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2048">
<title>ML1 – Outlets Tablet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2048px;height:1536px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<!-- Status Bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 48px;background:#F2F2F7;font-size:28px;font-weight:600;color:#111827">
  <span>8:52</span>
  <div style="display:flex;align-items:center;gap:12px">
    <span style="font-size:26px">5G</span>
    <svg width="52" height="26" viewBox="0 0 52 26"><rect x="1" y="1" width="46" height="24" rx="5" fill="#111827"/><rect x="47" y="8" width="4" height="10" rx="2" fill="#111827"/></svg>
  </div>
</div>

<!-- Nav Bar -->
<div style="display:flex;align-items:center;gap:24px;padding:20px 48px;background:white;border-bottom:1px solid #E5E7EB" id="nav">
  <div style="width:72px;height:72px;background:#F3F4F6;border-radius:18px;display:flex;align-items:center;justify-content:center">
    <span style="font-size:36px;color:#374151;font-weight:300">‹</span>
  </div>
  <div>
    <div style="font-size:52px;font-weight:700;color:#111827;line-height:1">Outlets</div>
    <div style="font-size:30px;color:#9CA3AF;margin-top:4px">Demo Kitchen · 2 outlets · Today</div>
  </div>
</div>

<div style="padding:36px 48px">
  <!-- Hero All Outlets -->
  <div id="all-outlets-hero" style="background:#0A0A0A;border-radius:24px;padding:48px 60px;margin-bottom:28px">
    <div style="font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:20px">ALL OUTLETS</div>
    <div style="display:flex;gap:100px;align-items:flex-end">
      <div>
        <div style="font-size:88px;font-weight:900;color:white;font-family:'SF Mono',Consolas,monospace;letter-spacing:-0.03em;line-height:1">₹84,850.00</div>
        <div style="font-size:28px;color:#9CA3AF;margin-top:12px">Net Sales</div>
      </div>
      <div>
        <div style="font-size:88px;font-weight:900;color:#4ADE80;font-family:'SF Mono',Consolas,monospace;letter-spacing:-0.03em;line-height:1">₹16,750.00</div>
        <div style="font-size:28px;color:#9CA3AF;margin-top:12px">Net P&amp;L</div>
      </div>
    </div>
  </div>

  <!-- Outlet Cards Side-by-Side -->
  <div id="outlet-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
    <!-- Koramangala -->
    <div style="background:white;border-radius:24px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,0.07)">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px">
        <div style="width:52px;height:52px;background:#FFF7ED;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px">📍</div>
        <span style="font-size:36px;font-weight:700;color:#111827">Demo Kitchen — Koramangala</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">NET SALES</div>
          <div style="font-size:36px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827">₹48,650.00</div>
        </div>
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">NET P&amp;L</div>
          <div style="font-size:36px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#1DAA4B">₹9,850.00</div>
        </div>
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">ORDERS</div>
          <div style="font-size:36px;font-weight:700;color:#111827">112</div>
        </div>
      </div>
    </div>
    <!-- Indiranagar -->
    <div style="background:white;border-radius:24px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,0.07)">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px">
        <div style="width:52px;height:52px;background:#FFF7ED;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px">📍</div>
        <span style="font-size:36px;font-weight:700;color:#111827">Demo Kitchen — Indiranagar</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">NET SALES</div>
          <div style="font-size:36px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#111827">₹36,200.00</div>
        </div>
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">NET P&amp;L</div>
          <div style="font-size:36px;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:#1DAA4B">₹6,900.00</div>
        </div>
        <div style="background:#F9FAFB;border-radius:16px;padding:24px">
          <div style="font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#9CA3AF;margin-bottom:10px">ORDERS</div>
          <div style="font-size:36px;font-weight:700;color:#111827">87</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const isHL = new URLSearchParams(location.search).get('hl') === '1';
if (isHL) {
  document.getElementById('nav').style.filter='brightness(0.6)';
  document.querySelector('body > div:first-child').style.filter='brightness(0.6)';
  document.getElementById('outlet-cards').style.filter='brightness(0.6)';
  const hero = document.getElementById('all-outlets-hero');
  hero.style.outline='3px solid #F87171';
  hero.style.outlineOffset='8px';
  hero.style.borderRadius='24px';
  hero.style.position='relative';
  hero.style.zIndex='10';
}
</script>
</body>
</html>
