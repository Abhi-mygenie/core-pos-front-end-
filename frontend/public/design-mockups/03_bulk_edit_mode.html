<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Setup - Bulk Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryOrange: '#F97316', primaryGreen: '#22C55E', darkText: '#1F2937', grayText: '#6B7280', borderGray: '#E5E7EB', sectionBg: '#F9FAFB', errorText: '#EF4444', lightBg: '#FFFFFF'
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], body: ['system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'system-ui', sans-serif; background-color: #e5e7eb; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex bg-black/40">
    <div class="flex-1"></div>
    
    <div class="w-11/12 max-w-[1440px] h-full bg-sectionBg shadow-2xl flex flex-col" data-testid="expense-setup-panel">
        
        <header class="border-b border-borderGray px-8 py-4 bg-white flex items-center justify-between z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <i data-lucide="table-2" class="w-6 h-6 text-primaryOrange"></i>
                <h1 class="text-xl font-semibold text-darkText tracking-tight">Bulk Editor</h1>
                <span class="px-2 py-0.5 bg-gray-100 text-grayText text-xs rounded-full font-medium">34 items</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative w-64 mr-2">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-grayText"></i>
                    <input data-testid="items-search" type="text" placeholder="Search items..." class="w-full pl-9 pr-3 py-2 text-sm border border-borderGray rounded-md focus:outline-none focus:border-primaryOrange bg-sectionBg">
                </div>
                <button class="px-4 py-2 bg-primaryGreen text-white rounded-md hover:bg-green-600 transition-colors flex items-center gap-2 font-medium text-sm shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Item
                </button>
                <button class="px-5 py-2 bg-primaryOrange text-white rounded-md hover:bg-orange-600 transition-colors flex items-center gap-2 font-medium text-sm shadow-sm">
                    Save 3 Changes
                </button>
                <button data-testid="bulk-editor-close-btn" class="p-2 text-grayText hover:bg-gray-100 rounded-md transition-colors ml-2">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
        </header>

        <!-- Selection Banner (Option B) -->
        <div class="border-l-4 border-red-500 px-8 py-3 flex justify-between items-center z-10" style="background: rgba(239, 68, 68, 0.10);">
            <span class="font-bold text-red-600 text-sm">2 items selected</span>
            <div class="flex items-center gap-3">
                <button data-testid="bulk-delete-selected-btn" class="bg-red-500 text-white px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-1.5 hover:bg-red-600 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Delete Selected
                </button>
                <button data-testid="bulk-clear-selection-btn" class="text-grayText text-sm font-medium hover:text-darkText transition-colors px-2">
                    Clear
                </button>
            </div>
        </div>
        <div data-testid="bulk-move-deferred-note" class="text-xs italic text-[#6B7280] text-right px-8 py-1">
            Bulk Move-to-Category is coming soon (backend delivery pending).
        </div>

        <div class="flex-1 overflow-hidden flex flex-col bg-sectionBg p-0">
            <div class="flex-1 bg-white flex flex-col overflow-hidden">
                <div class="flex-1 overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white z-20 shadow-sm border-b border-borderGray">
                            <tr class="bg-sectionBg text-xs uppercase tracking-wider text-grayText">
                                <th class="w-12 text-center p-3 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-all" class="w-4 h-4 rounded border-gray-300 text-primaryOrange focus:ring-primaryOrange" checked>
                                </th>
                                <th class="w-10 text-center p-3 border-r border-borderGray">#</th>
                                <th class="p-3 font-semibold w-[35%] cursor-pointer hover:bg-gray-100 group border-r border-borderGray text-primaryOrange">
                                    <div class="flex items-center justify-between">Item Name <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-primaryOrange"></i></div>
                                </th>
                                <th class="p-3 font-semibold w-[25%] cursor-pointer hover:bg-gray-100 group border-r border-borderGray">
                                    <div class="flex items-center justify-between">Category <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-grayText opacity-50 group-hover:opacity-100"></i></div>
                                </th>
                                <th class="p-3 font-semibold w-[20%] cursor-pointer hover:bg-gray-100 group border-r border-borderGray">
                                    <div class="flex items-center justify-between">Unit Price <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-grayText opacity-50 group-hover:opacity-100"></i></div>
                                </th>
                                <th class="p-3 font-semibold w-[10%] text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Category 1: Vegetables -->
                            <tr class="bg-gray-100 sticky top-[41px] z-10 border-b border-borderGray border-l-4 border-l-primaryOrange">
                                <td colspan="6" class="p-2 px-4">
                                    <div class="flex items-center justify-between">
                                        <span class="font-semibold text-darkText text-sm">Vegetables</span>
                                        <span class="px-2 py-0.5 bg-white border border-borderGray text-grayText text-xs rounded-full font-medium shadow-sm">3</span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 1: Vegetables (clean, selected) -->
                            <tr class="border-b border-borderGray group hover:bg-gray-50/50 bg-white">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-1" class="w-4 h-4 rounded border-gray-300 text-primaryOrange" checked>
                                </td>
                                <td class="text-center p-2 border-r border-borderGray text-xs text-grayText">1</td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Tomatoes" class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors text-darkText">
                                        <option selected>Vegetables</option>
                                        <option>Dairy & Eggs</option>
                                        <option>Pantry</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="number" value="2.50" class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-delete-1" class="p-1.5 text-grayText hover:text-errorText hover:bg-red-50 rounded transition-colors opacity-0 group-hover:opacity-100 mx-auto block"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Row 2: Vegetables (dirty cell) -->
                            <tr class="border-b border-borderGray bg-amber-50/40 relative group">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-2" class="w-4 h-4 rounded border-gray-300 text-primaryOrange">
                                </td>
                                <td class="text-center p-2 border-r border-borderGray text-xs text-grayText">2</td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Onions" class="w-full px-2 py-1.5 text-sm border border-transparent rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent text-darkText">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent text-darkText">
                                        <option selected>Vegetables</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray bg-amber-100/60">
                                    <input type="number" value="1.80" class="w-full px-2 py-1.5 text-sm border border-amber-300 rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-white shadow-inner font-medium text-darkText">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-undo-2" title="Undo" class="p-1.5 text-grayText hover:text-darkText hover:bg-gray-200 rounded transition-colors mx-auto block"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Row 3: Vegetables (new unsaved) -->
                            <tr class="border-b border-borderGray bg-green-50/40 relative group">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-new1" class="w-4 h-4 rounded border-gray-300 text-primaryOrange">
                                </td>
                                <td class="text-center p-2 border-r border-borderGray text-lg font-bold text-primaryGreen">+</td>
                                <td class="p-2 border-r border-borderGray bg-green-100/60">
                                    <input type="text" value="Carrots" class="w-full px-2 py-1.5 text-sm border border-green-300 rounded focus:border-primaryGreen focus:outline-none focus:ring-1 focus:ring-primaryGreen bg-white shadow-inner font-medium text-darkText">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent rounded focus:border-primaryGreen focus:outline-none focus:ring-1 focus:ring-primaryGreen bg-transparent text-darkText">
                                        <option selected>Vegetables</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray bg-green-100/60">
                                    <input type="number" value="1.20" class="w-full px-2 py-1.5 text-sm border border-green-300 rounded focus:border-primaryGreen focus:outline-none focus:ring-1 focus:ring-primaryGreen bg-white shadow-inner font-medium text-darkText">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-delete-new1" title="Delete new row" class="p-1.5 text-red-500 hover:bg-red-100 rounded transition-colors mx-auto block"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Category 2: Dairy & Eggs -->
                            <tr class="bg-gray-100 sticky top-[41px] z-10 border-b border-borderGray border-l-4 border-l-primaryOrange">
                                <td colspan="6" class="p-2 px-4">
                                    <div class="flex items-center justify-between">
                                        <span class="font-semibold text-darkText text-sm">Dairy & Eggs</span>
                                        <span class="px-2 py-0.5 bg-white border border-borderGray text-grayText text-xs rounded-full font-medium shadow-sm">2</span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 4: Dairy (just-saved) -->
                            <tr class="border-b border-borderGray bg-green-50/40 relative group">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-3" class="w-4 h-4 rounded border-gray-300 text-primaryOrange">
                                </td>
                                <td class="text-center p-2 border-r border-borderGray">
                                    <i data-lucide="check" class="w-4 h-4 text-primaryGreen mx-auto"></i>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Milk" class="w-full px-2 py-1.5 text-sm border border-transparent rounded bg-transparent text-darkText">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent rounded bg-transparent text-darkText">
                                        <option selected>Dairy & Eggs</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="number" value="3.50" class="w-full px-2 py-1.5 text-sm border border-transparent rounded bg-transparent text-darkText">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-delete-3" class="p-1.5 text-grayText hover:text-errorText hover:bg-red-50 rounded transition-colors opacity-0 group-hover:opacity-100 mx-auto block"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Row 5: Dairy (validation error) -->
                            <tr class="border-b border-borderGray bg-red-50/40 relative group border-l-4 border-l-red-500">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-4" class="w-4 h-4 rounded border-gray-300 text-primaryOrange">
                                </td>
                                <td class="text-center p-2 border-r border-borderGray">
                                    <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 mx-auto" title="Invalid price"></i>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Eggs" class="w-full px-2 py-1.5 text-sm border border-transparent rounded bg-transparent text-darkText">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent rounded bg-transparent text-darkText">
                                        <option selected>Dairy & Eggs</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray bg-red-100/60">
                                    <input type="text" value="-1.00" class="w-full px-2 py-1.5 text-sm border border-red-400 rounded focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 bg-white shadow-inner font-medium text-red-600">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-undo-4" title="Undo" class="p-1.5 text-grayText hover:text-darkText hover:bg-gray-200 rounded transition-colors mx-auto block"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Category 3: Pantry -->
                            <tr class="bg-gray-100 sticky top-[41px] z-10 border-b border-borderGray border-l-4 border-l-primaryOrange">
                                <td colspan="6" class="p-2 px-4">
                                    <div class="flex items-center justify-between">
                                        <span class="font-semibold text-darkText text-sm">Pantry</span>
                                        <span class="px-2 py-0.5 bg-white border border-borderGray text-grayText text-xs rounded-full font-medium shadow-sm">2</span>
                                    </div>
                                </td>
                            </tr>

                            <!-- Row 6: Pantry (clean, selected) -->
                            <tr class="border-b border-borderGray group hover:bg-gray-50/50 bg-white">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-5" class="w-4 h-4 rounded border-gray-300 text-primaryOrange" checked>
                                </td>
                                <td class="text-center p-2 border-r border-borderGray text-xs text-grayText">6</td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Flour" class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors">
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <select class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors text-darkText">
                                        <option selected>Pantry</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="number" value="4.00" class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-borderGray rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent focus:bg-white transition-colors">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-delete-5" class="p-1.5 text-grayText hover:text-errorText hover:bg-red-50 rounded transition-colors opacity-0 group-hover:opacity-100 mx-auto block"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </td>
                            </tr>

                            <!-- Row 7: Pantry (dirty, category changed) -->
                            <tr class="border-b border-borderGray bg-amber-50/40 relative group">
                                <td class="text-center p-2 border-r border-borderGray">
                                    <input type="checkbox" data-testid="bulk-select-row-6" class="w-4 h-4 rounded border-gray-300 text-primaryOrange">
                                </td>
                                <td class="text-center p-2 border-r border-borderGray text-xs text-grayText">7</td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="text" value="Sugar" class="w-full px-2 py-1.5 text-sm border border-transparent rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent text-darkText">
                                </td>
                                <td class="p-2 border-r border-borderGray bg-amber-100/60">
                                    <select class="w-full px-2 py-1.5 text-sm border border-amber-300 rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-white shadow-inner text-darkText font-medium">
                                        <option selected>Pantry</option>
                                        <option>Vegetables</option>
                                    </select>
                                </td>
                                <td class="p-2 border-r border-borderGray">
                                    <input type="number" value="2.50" class="w-full px-2 py-1.5 text-sm border border-transparent rounded focus:border-primaryOrange focus:outline-none focus:ring-1 focus:ring-primaryOrange bg-transparent text-darkText">
                                </td>
                                <td class="p-2 text-center">
                                    <button data-testid="row-undo-6" title="Undo" class="p-1.5 text-grayText hover:text-darkText hover:bg-gray-200 rounded transition-colors mx-auto block"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Footer Bar -->
            <div class="border-t border-borderGray px-8 py-4 flex items-center justify-between z-10" style="background: linear-gradient(to right, #FFF7ED, #FFFFFF);">
                <span class="text-sm text-darkText"><span class="font-bold text-primaryOrange">3 items</span> modified</span>
                <div class="flex items-center gap-3">
                    <button data-testid="footer-reset-all-btn" class="px-4 py-2 bg-white border border-borderGray text-darkText rounded-md hover:bg-gray-50 transition-colors font-medium text-sm shadow-sm">
                        Reset All
                    </button>
                    <button data-testid="footer-save-btn" class="px-5 py-2 bg-primaryOrange text-white rounded-md hover:bg-orange-600 transition-colors font-medium text-sm shadow-sm flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Save 3 Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
