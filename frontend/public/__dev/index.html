<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>MyGenie POS — Control Dashboard (Dev)</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- CR-046: auth.js loads first (vanilla JS, no React dependency) -->
  <script src="./auth.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen text-slate-400">
      Loading control dashboard…
    </div>
  </div>
  <script>
    // CR-046: Login gate — dashboard only loads after auth check
    if (!checkAuth()) {
      renderLoginScreen(document.getElementById('root'));
    } else {
      // Auth passed — load React + Babel + dashboard
      var cdnScripts = [
        'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4',
        'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
        'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
        'https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.7/babel.min.js'
      ];
      var loaded = 0;
      cdnScripts.forEach(function(src) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = function() {
          loaded++;
          if (loaded === cdnScripts.length) {
            // All CDN scripts loaded — fetch dashboard.js and transform via Babel
            fetch('./dashboard.js').then(function(r) { return r.text(); }).then(function(code) {
              var transformed = Babel.transform(code, { presets: ['react'] }).code;
              var s = document.createElement('script');
              s.textContent = transformed;
              document.body.appendChild(s);
            });
          }
        };
        document.head.appendChild(s);
      });
    }
  </script>
</body>
</html>
