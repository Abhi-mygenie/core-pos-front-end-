<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Setup - Delete Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryOrange: '#F97316', primaryGreen: '#22C55E', darkText: '#1F2937', grayText: '#6B7280', borderGray: '#E5E7EB', sectionBg: '#F9FAFB', errorText: '#EF4444', lightBg: '#FFFFFF'
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], body: ['system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'system-ui', sans-serif; background-color: #e5e7eb; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex bg-black/40 relative">
    <div class="flex-1"></div>
    
    <!-- Base Panel (blurred out/dimmed by overlay) -->
    <div class="w-11/12 max-w-[1440px] h-full bg-sectionBg shadow-2xl flex flex-col pointer-events-none" data-testid="expense-setup-panel">
        <header class="border-b border-borderGray px-8 py-5 bg-white flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-darkText tracking-tight">Expense Setup</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="px-4 py-2 bg-white border border-borderGray text-darkText rounded-md flex items-center gap-2 text-sm shadow-sm"><i data-lucide="table" class="w-4 h-4"></i> Bulk Edit</button>
            </div>
        </header>
        <div class="px-8 border-b border-borderGray bg-white flex gap-6">
            <button class="py-3 border-b-2 border-primaryOrange text-primaryOrange font-medium text-sm">Stock Master</button>
        </div>
        <div class="flex-1 overflow-hidden flex bg-sectionBg p-6 gap-6">
            <div class="w-[30%] bg-white border border-borderGray rounded-lg flex flex-col shadow-sm">
                <div class="p-4 border-b border-borderGray"><h2 class="font-semibold text-darkText">Categories</h2></div>
                <div class="p-2"><div class="p-2.5 rounded-md bg-orange-50 text-primaryOrange"><span class="text-sm font-semibold">Vegetables</span></div></div>
            </div>
            <div class="flex-1 bg-white border border-borderGray rounded-lg shadow-sm">
                <div class="p-4 border-b border-borderGray"><h2 class="font-semibold text-darkText">Items in Vegetables</h2></div>
                <table class="w-full text-left border-collapse">
                    <tr class="border-b border-borderGray bg-sectionBg"><td class="p-4 text-sm font-medium">Tomatoes</td></tr>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center">
        <!-- Modal Dialog -->
        <div data-testid="delete-item-confirm" class="bg-white rounded-xl shadow-2xl w-[480px] max-w-[95vw] overflow-hidden transform transition-all scale-100 opacity-100 border border-borderGray">
            <div class="p-6">
                <!-- Icon -->
                <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 text-errorText mb-5 border border-red-200">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                
                <h3 class="text-xl font-bold text-darkText mb-2 tracking-tight text-center">Delete Item?</h3>
                <p class="text-grayText text-sm mb-6 text-center">
                    Are you sure you want to delete <span class="font-semibold text-darkText">"Tomatoes"</span>?
                </p>
                
                <!-- BUG-201 Warning text -->
                <div class="bg-red-50 text-errorText p-4 rounded-lg text-sm border border-red-200 mb-8 flex gap-3 items-start shadow-inner">
                    <i data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5 text-red-500"></i>
                    <div class="leading-relaxed">
                        <strong class="font-semibold text-red-700">Warning:</strong> This will also remove it from any associated recipes and historical expense records. This action cannot be undone.
                    </div>
                </div>
                
                <!-- Actions -->
                <div class="flex gap-3 justify-end pt-2 border-t border-borderGray">
                    <button class="px-5 py-2.5 border border-borderGray text-darkText rounded-md hover:bg-gray-50 transition-colors font-medium text-sm shadow-sm flex-1">
                        Cancel
                    </button>
                    <button class="px-5 py-2.5 bg-errorText text-white rounded-md hover:bg-red-600 transition-colors font-medium text-sm shadow-sm flex-1 flex justify-center items-center gap-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Yes, Delete Item
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
