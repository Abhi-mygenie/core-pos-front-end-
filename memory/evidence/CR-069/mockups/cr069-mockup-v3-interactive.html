// Pre-checked permissions for "Manager" demo
const CHECKED_PERMS = new Set(['food','pos','order','bill','serve','order_edit','ready','discount','confirm_order','transfer_table','merge_table','food_transfer','print_icon','employee','menu','restaurant_settings','table_management','report','revenue_report','sales_report','cancellation_report','table_view']);

const SECTION_COLORS = {
  orders: '#329937', discounts: '#F4A11A', tables: '#3B82F6', delivery: '#8B5CF6',
  menu: '#F26B33', customers: '#EC4899', settings: '#666666', reports: '#0EA5E9'
};

function renderPermCards() {
  const container = document.getElementById('perm-cards');
  container.innerHTML = PERMS_BY_FUNCTION.map(section => {
    const checkedCount = section.perms.filter(p => CHECKED_PERMS.has(p.key)).length;
    const allChecked = checkedCount === section.perms.length;
    const someChecked = checkedCount > 0 && !allChecked;
    const color = SECTION_COLORS[section.id] || '#666';

    return `<div class="bg-white rounded-xl border overflow-hidden" style="border-color:#E5E5E5" data-section="${section.id}">
      <!-- Section Header -->
      <div class="flex items-center justify-between px-5 py-3.5 cursor-pointer hover:bg-gray-50 transition-colors" onclick="toggleSection(this)">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-base" style="background:${color}12;color:${color}">${section.icon}</div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold" style="color:#1A1A1A">${section.title}</span>
              <span class="text-xs px-1.5 py-0.5 rounded-full font-medium" style="background:${checkedCount>0 ? color+'18' : '#F7F7F7'};color:${checkedCount>0 ? color : '#999'}">${checkedCount}/${section.perms.length}</span>
            </div>
            <div class="text-xs mt-0.5" style="color:#999">${section.desc}</div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:#666" onclick="event.stopPropagation()">
            <input type="checkbox" ${allChecked?'checked':''} ${someChecked?'style="opacity:0.5"':''} onchange="toggleSectionAll(this,'${section.id}')" class="w-3.5 h-3.5 rounded cursor-pointer accent-green-600"> All
          </label>
          <svg class="accordion-chevron w-4 h-4" style="color:#999" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
      <!-- Section Body (hidden by default, expanded for first 2) -->
      <div class="border-t px-5 py-3 hidden" style="border-color:#E5E5E5" data-body="${section.id}">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-1">
          ${section.perms.map(p => `<label class="flex items-start gap-2.5 rounded-lg px-3 py-2.5 cursor-pointer hover:bg-gray-50 transition-colors group" data-perm="${p.key}">
            <input type="checkbox" ${CHECKED_PERMS.has(p.key)?'checked':''} value="${p.key}" onchange="updatePermCounter()" class="w-4 h-4 rounded cursor-pointer accent-green-600 mt-0.5 perm-cb flex-shrink-0">
            <div class="min-w-0">
              <div class="text-sm font-medium" style="color:#1A1A1A">${p.label}</div>
              <div class="text-xs mt-0.5" style="color:#999">${p.desc}</div>
            </div>
          </label>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  // Auto-expand first two sections
  const firstTwo = container.querySelectorAll('[data-section]');
  [0,1].forEach(i => { if(firstTwo[i]) { firstTwo[i].querySelector('[data-body]').classList.remove('hidden'); firstTwo[i].querySelector('.accordion-chevron').classList.add('open'); }});

  updatePermCounter();
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.accordion-chevron');
  body.classList.toggle('hidden');
  chevron.classList.toggle('open');
}

function toggleSectionAll(masterCb, sectionId) {
  const body = document.querySelector(`[data-body="${sectionId}"]`);
  body.querySelectorAll('.perm-cb').forEach(cb => { cb.checked = masterCb.checked; });
  updatePermCounter();
}

function selectAllPermsGlobal() {
  document.querySelectorAll('#perm-cards .perm-cb').forEach(cb => cb.checked = true);
  document.querySelectorAll('#perm-cards input[type="checkbox"]').forEach(cb => cb.checked = true);
  updatePermCounter();
}

function clearAllPerms() {
  document.querySelectorAll('#perm-cards .perm-cb').forEach(cb => cb.checked = false);
  document.querySelectorAll('#perm-cards input[type="checkbox"]').forEach(cb => cb.checked = false);
  updatePermCounter();
}

function updatePermCounter() {
  const total = document.querySelectorAll('#perm-cards .perm-cb').length;
  const checked = document.querySelectorAll('#perm-cards .perm-cb:checked').length;
  document.getElementById('perm-counter').textContent = `${checked} / ${total} selected`;
  // Update section "All" checkboxes
  PERMS_BY_FUNCTION.forEach(section => {
    const card = document.querySelector(`[data-section="${section.id}"]`);
    if (!card) return;
    const cbs = card.querySelectorAll('.perm-cb');
    const allCb = card.querySelector('input[type="checkbox"]:not(.perm-cb)');
    const checkedInSection = [...cbs].filter(c => c.checked).length;
    if (allCb) {
      allCb.checked = checkedInSection === cbs.length;
      allCb.style.opacity = (checkedInSection > 0 && checkedInSection < cbs.length) ? '0.5' : '1';
    }
    // Update badge
    const badge = card.querySelector('.rounded-full.font-medium');
    const color = SECTION_COLORS[section.id] || '#666';
    if (badge) {
      badge.textContent = `${checkedInSection}/${cbs.length}`;
      badge.style.background = checkedInSection > 0 ? color+'18' : '#F7F7F7';
      badge.style.color = checkedInSection > 0 ? color : '#999';
    }
  });
}

function applyTemplate(val) {
  // Simulate template pre-fill
  clearAllPerms();
  if (!val) return;
  const templates = {
    'Owner': null, // all
    'Manager': ['pos','order','bill','order_edit','order_cancel','serve','ready','confirm_order','food','discount','complementary_food','table_view','transfer_table','merge_table','food_transfer','delivery_man','show_online_order','assign_online_order','menu','employee','restaurant_settings','printer','print_icon','customer_management','report','sales_report','revenue_report','sattle_report','cancellation_report','waiter_revenue_report'],
    'Captain': ['pos','order','bill','serve','ready','confirm_order','food','table_view','transfer_table','merge_table','food_transfer','print_icon','customer_management'],
    'Cashier': ['pos','order','bill','confirm_order','food','discount','update_payment','clear_payment','print_icon','report','sales_report','sattle_report'],
    'Waiter(S)': ['pos','order','food','serve','ready','table_view','print_icon'],
    'Waiter(T)': ['pos','order','food','serve','ready','table_view','transfer_table','print_icon'],
  };
  const perms = templates[val];
  if (perms === null) { selectAllPermsGlobal(); return; }
  if (perms) { perms.forEach(k => { const cb = document.querySelector(`.perm-cb[value="${k}"]`); if(cb) cb.checked = true; }); }
  updatePermCounter();
}

let nextId = 9000;

// ── Render Employee Grid ──────────────────────────────────────────────
function renderEmployeeGrid() {
  const body = document.getElementById('employee-grid-body');
  const roleOpts = ROLES_LIST.map(r => `<option value="${r}">${r}</option>`).join('');
  const newCount = EMPLOYEES.filter(e => e.isNew).length;

  body.innerHTML = EMPLOYEES.map((e, idx) => {
    const rowCls = e.isNew ? 'new-row' : '';
    const bgStyle = e.isNew ? 'background:rgba(50,153,55,0.04)' : '';
    const delBtn = e.isNew
      ? `<button onclick="removeRow(${idx})" title="Remove" class="p-1 rounded hover:bg-red-50"><svg class="w-4 h-4" style="color:#EF4444" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`
      : `<button onclick="toggleActive(${idx})" title="${e.active?'Deactivate':'Activate'}" class="p-1 rounded hover:bg-gray-100"><svg class="w-4 h-4" style="color:${e.active?'#329937':'#999'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${e.active?'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z':'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z'}"/></svg></button>`;

    return `<tr class="${rowCls} border-b hover:bg-gray-50 transition-colors" style="border-color:#E5E5E5;${bgStyle}" data-testid="employee-row-${e.id}">
      <td class="py-2 px-3"><input class="inline-input" value="${e.fname}" placeholder="First name *" onchange="markDirty(${idx},'fname',this.value)" data-testid="emp-fname-${e.id}"></td>
      <td class="py-2 px-3"><input class="inline-input" value="${e.lname}" placeholder="Last name" onchange="markDirty(${idx},'lname',this.value)"></td>
      <td class="py-2 px-3"><input class="inline-input" value="${e.phone}" placeholder="Phone *" onchange="markDirty(${idx},'phone',this.value)"></td>
      <td class="py-2 px-3"><input class="inline-input" value="${e.email}" placeholder="Email" onchange="markDirty(${idx},'email',this.value)"></td>
      <td class="py-2 px-3"><input class="inline-input" type="password" value="${e.isNew?'':'••••••'}" placeholder="${e.isNew?'Password *':'••••••'}" ${e.isNew?'':'disabled style="background:#F7F7F7;color:#999;border-color:#E5E5E5;border-radius:6px;padding:5px 8px;font-size:13px;width:100%"'}></td>
      <td class="py-2 px-3"><select class="inline-select" onchange="markDirty(${idx},'role',this.value)"><option value="">Select...</option>${roleOpts.replace('value="'+e.role+'"','value="'+e.role+'" selected')}</select></td>
      <td class="py-2 px-3 text-center"><span class="inline-flex items-center text-xs font-medium px-2 py-0.5 rounded-full" style="background:${e.active?'rgba(50,153,55,0.1)':'rgba(239,68,68,0.1)'};color:${e.active?'#329937':'#EF4444'}">${e.active?'Active':'Off'}</span></td>
      <td class="py-2 px-3 text-center">${delBtn}</td>
    </tr>`;
  }).join('');

  // Show/hide Save All button
  const saveBtn = document.getElementById('save-all-btn');
  if (newCount > 0) {
    saveBtn.style.display = 'flex';
    document.getElementById('dirty-count').textContent = `${newCount} unsaved row${newCount>1?'s':''}`;
  } else {
    saveBtn.style.display = 'none';
    document.getElementById('dirty-count').textContent = '';
  }
}

function addEmployeeRow() {
  nextId++;
  EMPLOYEES.unshift({ id: nextId, fname: '', lname: '', phone: '', email: '', role: '', active: true, isNew: true });
  renderEmployeeGrid();
  // Focus first input of new row
  setTimeout(() => {
    const firstInput = document.querySelector(`[data-testid="emp-fname-${nextId}"]`);
    if (firstInput) firstInput.focus();
  }, 50);
}

function removeRow(idx) {
  EMPLOYEES.splice(idx, 1);
  renderEmployeeGrid();
}

function toggleActive(idx) {
  EMPLOYEES[idx].active = !EMPLOYEES[idx].active;
  renderEmployeeGrid();
}

function markDirty(idx, field, value) {
  EMPLOYEES[idx][field] = value;
  EMPLOYEES[idx]._dirty = true;
  const saveBtn = document.getElementById('save-all-btn');
  saveBtn.style.display = 'flex';
}

function flashSaved() {
  // Simulate save — remove isNew flags
  EMPLOYEES.forEach(e => { e.isNew = false; e._dirty = false; });
  renderEmployeeGrid();
  // Flash success
  const saveBtn = document.getElementById('save-all-btn');
  saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Saved!';
  saveBtn.style.background = '#16A34A';
  setTimeout(() => { saveBtn.style.display = 'none'; saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Save All'; saveBtn.style.background = '#329937'; }, 1200);
}

// ── Roles ─────────────────────────────────────────────────────────────
function renderRoles() {
  document.getElementById('role-tbody').innerHTML = ROLE_DATA.map(r => `
    <tr class="border-b hover:bg-gray-50" style="border-color:#E5E5E5">
      <td class="py-3 px-4 text-sm font-medium" style="color:#1A1A1A">${r.name}</td>
      <td class="py-3 px-4"><span class="text-xs px-1.5 py-0.5 rounded-full" style="background:rgba(242,107,51,0.1);color:#F26B33">${r.modules}</span></td>
      <td class="py-3 px-4"><div class="flex items-center justify-end gap-3">
        <button onclick="showView('role-form-view','edit')" class="p-1 rounded hover:bg-orange-50" style="color:#F26B33"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button>
        <button onclick="this.closest('tr').querySelector('.status-badge').click()" class="relative w-11 h-6 rounded-full cursor-pointer" style="background:${r.active?'#329937':'#E5E5E5'}"><span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow" style="left:${r.active?'22px':'2px'}"></span></button>
      </div></td>
    </tr>`).join('');
}

// ── Permission Accordions — now rendered by renderPermCards() ──────

// ── Navigation ────────────────────────────────────────────────────────
const ALL_VIEWS = ['employee-list-view','role-list-view','role-form-view'];
function showView(viewId, mode) {
  ALL_VIEWS.forEach(id => document.getElementById(id).classList.add('hidden'));
  const el = document.getElementById(viewId);
  el.classList.remove('hidden');
  el.classList.remove('view-transition'); void el.offsetWidth; el.classList.add('view-transition');
  if (viewId === 'role-form-view') document.getElementById('role-form-title').textContent = mode === 'edit' ? 'Edit Role' : 'Add Role';
}

function switchTab(tab) {
  const empTab = document.getElementById('tab-employees');
  const roleTab = document.getElementById('tab-roles');
  if (tab === 'employees') {
    empTab.style.borderColor = '#F26B33'; empTab.style.color = '#F26B33';
    roleTab.style.borderColor = 'transparent'; roleTab.style.color = '#666';
    showView('employee-list-view');
  } else {
    roleTab.style.borderColor = '#F26B33'; roleTab.style.color = '#F26B33';
    empTab.style.borderColor = 'transparent'; empTab.style.color = '#666';
    showView('role-list-view');
  }
}

function toggleAccordion(btn) {
  const body = btn.nextElementSibling;
  btn.querySelector('.accordion-chevron').classList.toggle('open');
  body.classList.toggle('hidden');
}

function selectAllPerms(cb, grid) {
  grid.querySelectorAll('.perm-cb').forEach(c => c.checked = cb.checked);
}

// ── Init ──────────────────────────────────────────────────────────────
renderEmployeeGrid();
renderRoles();
renderPermCards();
</script>
